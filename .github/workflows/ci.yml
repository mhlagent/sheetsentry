name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: moon version --all

      - name: Update registry
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native --deny-warn

      - name: Build
        run: moon build --target native --deny-warn

      - name: Format and public API
        run: |
          moon fmt --check
          git diff --exit-code
          moon info --target native

      - name: CLI smoke test
        run: |
          moon run --target native cmd/main -- audit fixtures/bad_model.xlsx --format json --out findings.json
          moon run --target native cmd/main -- audit fixtures/clean_model.xlsx --fail-on low

      - name: CLI failure-mode tests
        run: bash scripts/cli_smoke.sh

      - name: Install independent formula engine
        run: python3 -m pip install --quiet formulas==1.3.4 openpyxl

      - name: Reproducible examples
        env:
          RUN_CROSSCHECK: "1"
        run: |
          bash scripts/build_examples.sh
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Cross-check complex slice
        run: |
          moon run --target native cmd/main -- slice fixtures/bad_model.xlsx \
            --target "Summary!B3" \
            --target "Summary!B10" \
            --target "Summary!B11" \
            --target "Summary!B12" \
            --target "Summary!B13" \
            --target "Summary!B14" \
            --out /tmp/complex-slice.xlsx \
            --manifest /tmp/complex-slice.json \
            --external external_book.xlsx=fixtures/external_book.xlsx \
            --strict
          python3 scripts/crosscheck_formulas.py /tmp/complex-slice.xlsx /tmp/complex-slice.json

      - name: Cross-check formula coverage
        run: |
          TARGETS=$(python3 -c 'print(",".join(f"Coverage!B{i}" for i in range(2,32)))')
          moon run --target native cmd/main -- slice fixtures/formula_coverage.xlsx \
            --targets "$TARGETS" \
            --out /tmp/coverage-slice.xlsx \
            --manifest /tmp/coverage-slice.json \
            --strict
          python3 scripts/crosscheck_formulas.py /tmp/coverage-slice.xlsx /tmp/coverage-slice.json
